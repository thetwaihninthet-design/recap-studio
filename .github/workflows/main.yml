            private Notification buildNotif(String text) {
              Intent i = new Intent(this, MainActivity.class);
              i.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
              PendingIntent pi = PendingIntent.getActivity(this, 0, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              return new NotificationCompat.Builder(this, CH)
                .setSmallIcon(android.R.drawable.ic_dialog_info)
                .setContentTitle("Shwe Recap Studio")
                .setContentText(text)
                .setContentIntent(pi)
                .setOngoing(true)
                .build();
            }
            private void updateNotif(String text) { try { nm.notify(NID, buildNotif(text)); } catch (Exception ignored) {} }

            private File bgDir() { File d = new File(getCacheDir(), "recap-bg"); if (!d.exists()) d.mkdirs(); return d; }
            private void writeJsonFile(String name, JSONObject o) {
              try {
                File tmp = new File(bgDir(), name + ".tmp");
                try (OutputStream os = new java.io.FileOutputStream(tmp)) { os.write(o.toString().getBytes(StandardCharsets.UTF_8)); }
                tmp.renameTo(new File(bgDir(), name));
              } catch (Exception ignored) {}
            }
            private JSONObject readJsonFile(String name) {
              try {
                File f = new File(bgDir(), name);
                if (!f.exists()) return new JSONObject();
                byte[] b = new byte[(int) f.length()];
                try (FileInputStream in = new FileInputStream(f)) { int n = 0, r; while (n < b.length && (r = in.read(b, n, b.length - n)) >= 0) n += r; }
                return new JSONObject(new String(b, StandardCharsets.UTF_8));
              } catch (Exception e) { return new JSONObject(); }
            }
            private void writeStatus(String state, String kind, String label, int done, int total, String error) {
              try {
                JSONObject o = new JSONObject();
                o.put("state", state); o.put("kind", kind); o.put("label", label);
                o.put("done", done); o.put("total", total); o.put("error", error);
                o.put("at", System.currentTimeMillis());
                writeJsonFile("status.json", o);
              } catch (Exception ignored) {}
            }
            private void writeResults(JSONObject patch) {
              try {
                JSONObject cur = readJsonFile("results.json");
                for (java.util.Iterator<String> it = patch.keys(); it.hasNext(); ) { String k = it.next(); cur.put(k, patch.get(k)); }
                writeJsonFile("results.json", cur);
              } catch (Exception ignored) {}
            }

            private String readAll(InputStream in) throws Exception {
              BufferedReader br = new BufferedReader(new InputStreamReader(in, StandardCharsets.UTF_8));
              StringBuilder sb = new StringBuilder(); String l;
              while ((l = br.readLine()) != null) sb.append(l).append("\n");
              return sb.toString();
            }
            private String httpGet(String url) throws Exception {
              HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
              c.setConnectTimeout(30000); c.setReadTimeout(60000);
              c.setRequestMethod("GET");
              int code = c.getResponseCode();
              InputStream in = code >= 400 ? c.getErrorStream() : c.getInputStream();
              String s = in == null ? "" : readAll(in);
              if (code >= 400) throw new Exception("HTTP " + code + ": " + s);
              return s;
            }
            private String httpPostJson(String url, String json) throws Exception {
              byte[] b = json.getBytes(StandardCharsets.UTF_8);
              HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
              c.setConnectTimeout(30000); c.setReadTimeout(120000);
              c.setRequestMethod("POST");
              c.setDoOutput(true);
              c.setRequestProperty("Content-Type", "application/json; charset=utf-8");
              c.setFixedLengthStreamingMode(b.length);
              try (OutputStream os = c.getOutputStream()) { os.write(b); }
              int code = c.getResponseCode();
              InputStream in = code >= 400 ? c.getErrorStream() : c.getInputStream();
              String s = in == null ? "" : readAll(in);
              if (code >= 400) throw new Exception("HTTP " + code + ": " + s);
              return s;
            }
            private static class MP {
              String name, filename, ctype; byte[] data; File file;
              MP(String n, String v) { name = n; filename = null; ctype = "text/plain; charset=utf-8"; data = v.getBytes(StandardCharsets.UTF_8); }
              MP(String n, String fn, String ct, byte[] d) { name = n; filename = fn; ctype = ct; data = d; }
              MP(String n, String fn, String ct, File f) { name = n; filename = fn; ctype = ct; file = f; }
            }
            private String httpPostMultipart(String url, java.util.List<MP> parts) throws Exception {
              String boundary = "----RecapBg" + System.currentTimeMillis();
              HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
              c.setConnectTimeout(30000); c.setReadTimeout(180000);
              c.setRequestMethod("POST");
              c.setDoOutput(true);
              c.setRequestProperty("Content-Type", "multipart/form-data; boundary=" + boundary);
              c.setChunkedStreamingMode(1024 * 1024);
              try (OutputStream os = c.getOutputStream()) {
                byte[] buf = new byte[65536];
                for (MP p : parts) {
                  os.write(("--" + boundary + "\r\n").getBytes(StandardCharsets.UTF_8));
                  if (p.filename != null) {
                    os.write(("Content-Disposition: form-data; name=\"" + p.name + "\"; filename=\"" + p.filename + "\"\r\n").getBytes(StandardCharsets.UTF_8));
                    os.write(("Content-Type: " + p.ctype + "\r\n\r\n").getBytes(StandardCharsets.UTF_8));
                  } else {
                    os.write(("Content-Disposition: form-data; name=\"" + p.name + "\"\r\n\r\n").getBytes(StandardCharsets.UTF_8));
                  }
                  if (p.file != null) {
                    try (InputStream in = new FileInputStream(p.file)) { int n; while ((n = in.read(buf)) >= 0) os.write(buf, 0, n); }
                  } else if (p.data != null) os.write(p.data);
                  os.write("\r\n".getBytes(StandardCharsets.UTF_8));
                }
                os.write(("--" + boundary + "--\r\n").getBytes(StandardCharsets.UTF_8));
                os.flush();
              }
              int code = c.getResponseCode();
              InputStream in = code >= 400 ? c.getErrorStream() : c.getInputStream();
              String s = in == null ? "" : readAll(in);
              if (code >= 400) throw new Exception("HTTP " + code + ": " + s);
              return s;
            }
            private JSONObject pollJob(String url, int maxTries) throws Exception {
              for (int i = 0; i < maxTries; i++) {
                Thread.sleep(3000);
                JSONObject j = new JSONObject(httpGet(url));
                String st = j.optString("status", "");
                if (st.equals("done") || st.equals("error")) return j;
              }
              throw new Exception("server job timed out");
            }

            private void runJob(JSONObject job) throws Exception {
              String kind = job.optString("kind", "");
              if (kind.equals("upload") || kind.equals("transcribe-all") || kind.equals("render")) {
                String uid = job.getString("uploadId");
                long totalSize = job.optLong("totalSize", 0);
                SharedPreferences sp = getSharedPreferences("recap-prefs", MODE_PRIVATE);
                String uriStr = sp.getString("video-uri", "");
                if (uriStr == null || uriStr.isEmpty()) throw new Exception("video not saved on phone - pick the video again");
                Uri uri = Uri.parse(uriStr);
                uploadVideo(uri, uid, totalSize);
                writeResults(new JSONObject().put("uploadId", uid).put("serverVidReady", true));
                if (kind.equals("upload")) {
                  writeStatus("done", "upload", "Video server ပေါ် တင်ပြီးပါပြီ", 1, 1, "");
                  updateNotif("Video server ပေါ် တင်ပြီးပါပြီ");
                  return;
                }
                if (kind.equals("transcribe-all")) { transcribeAll(job, uid, totalSize); return; }
                render(job, uid);
              } else throw new Exception("unknown job: " + kind);
            }

            private void uploadVideo(Uri uri, String uid, long totalSize) throws Exception {
              long CH = 8L * 1024 * 1024;
              long total = totalSize > 0 ? (totalSize + CH - 1) / CH : 0;
              if (total <= 0) throw new Exception("video size unknown - pick the video again");
              int resyncs = 0;
              while (true) {
                // Always ask the server which chunk it wants next - another uploader
                // (the app's foreground upload) may have sent some chunks already.
                JSONObject s = new JSONObject(httpGet(BASE + "/upload-status?uploadId=" + URLEncoder.encode(uid, "UTF-8")));
                if (s.optBoolean("done", false)) return;
                int idx = s.optInt("next", 0);
                if (idx >= total) return;
                // Read this one chunk fresh from the URI (no shared stream position).
                InputStream in = getContentResolver().openInputStream(uri);
                if (in == null) throw new Exception("cannot open video");
                long skipTo = idx * CH, skipped = 0;
                while (skipped < skipTo) { long n = in.skip(skipTo - skipped); if (n <= 0) break; skipped += n; }
                byte[] buf = new byte[1024 * 1024];
                ByteArrayOutputStream baos = new ByteArrayOutputStream();
                long want = Math.min(CH, totalSize - idx * CH), got = 0;
                try {
                  while (got < want) {
                    int n = in.read(buf, 0, (int) Math.min(buf.length, want - got));
                    if (n < 0) break;
                    baos.write(buf, 0, n); got += n;
                  }
                } finally { try { in.close(); } catch (Exception ignored) {} }
                if (got == 0) throw new Exception("video read failed at chunk " + idx);
                java.util.List<MP> parts = new java.util.ArrayList<>();
                parts.add(new MP("uploadId", uid));
                parts.add(new MP("index", String.valueOf(idx)));
                parts.add(new MP("total", String.valueOf(total)));
                parts.add(new MP("chunk", "video.mp4", "video/mp4", baos.toByteArray()));
                try {
                  JSONObject d = new JSONObject(httpPostMultipart(BASE + "/recap-chunk", parts));
                  if (d.has("error")) throw new Exception(d.optString("error", "upload failed"));
                  idx = d.optInt("next", idx + 1);
                  updateNotif("Video တင်နေပါတယ်… (" + idx + "/" + total + ")");
                  writeStatus("running", "upload", "chunk " + idx, idx, (int) total, "");
                } catch (Exception e) {
                  String msg = e.getMessage() == null ? "" : e.getMessage();
                  if (msg.indexOf("409") >= 0 || msg.indexOf("wrong chunk order") >= 0) {
                    if (++resyncs > 10) throw new Exception("upload keeps colliding - try again");
                    Thread.sleep(1000);
                    continue; // re-query status, send exactly the chunk the server wants
                  }
                  throw e;
                }
              }
            }

            private void transcribeAll(JSONObject job, String uid, long totalSize) throws Exception {
              JSONArray parts = job.getJSONArray("parts");
              String key = job.optString("geminiKey", "");
              JSONObject all = new JSONObject();
              for (int i = 0; i < parts.length(); i++) {
                JSONObject p = parts.getJSONObject(i);
                int pi = p.getInt("pi");
                double ps = p.getDouble("start"), pe = p.getDouble("end");
                updateNotif("အပိုင်း " + (pi + 1) + " စာသား ထုတ်နေပါတယ်… (" + (i + 1) + "/" + parts.length() + ")");
                writeStatus("running", "transcribe-all", "part " + (pi + 1), i, parts.length(), "");
                JSONObject tj = new JSONObject();
                tj.put("uploadId", uid); tj.put("partStart", ps); tj.put("partEnd", pe); tj.put("totalSize", totalSize);
                if (!key.isEmpty()) tj.put("geminiKey", key);
                JSONObject jr = new JSONObject(httpPostJson(BASE + "/transcribe-from-video", tj.toString()));
                String jid = jr.optString("job", "");
                if (jid.isEmpty()) throw new Exception(jr.optString("error", "transcribe failed"));
                JSONObject done = pollJob(BASE + "/transcribe-job?id=" + URLEncoder.encode(jid, "UTF-8"), 120);
                if (!done.optString("status", "").equals("done")) throw new Exception(done.optString("error", "transcribe failed"));
                JSONObject rec = new JSONObject();
                rec.put("lines", done.optJSONArray("lines") == null ? new JSONArray() : done.getJSONArray("lines"));
                rec.put("srt", done.optString("srt", ""));
                all.put("part" + pi, rec);
                JSONObject res = new JSONObject();
                res.put("transcripts", all);
                writeResults(res);
              }
              writeStatus("done", "transcribe-all", "စာသား အကုန် ရပြီးပါပြီ", parts.length(), parts.length(), "");
              updateNotif("စာသား အကုန် ရပြီးပါပြီ");
            }

            private void render(JSONObject job, String uid) throws Exception {
              double ss = job.getDouble("scopeStart"), se = job.getDouble("scopeEnd");
              String srt = job.optString("srt", "");
              String voiceName = job.optString("voiceFile", "voiceover.mp3");
              String outName = job.optString("outName", "movie-recap.mp4");
              File voice = new File(new File(getCacheDir(), "parts"), voiceName);
              if (!voice.exists() || voice.length() == 0) throw new Exception("voice file missing - generate the voice first");
              updateNotif("Server မှာ MP4 ထုတ်နေပါတယ်…");
              writeStatus("running", "render", "render", 0, 1, "");
              java.util.List<MP> parts = new java.util.ArrayList<>();
              parts.add(new MP("uploadId", uid));
              parts.add(new MP("scopeStart", String.valueOf(ss)));
              parts.add(new MP("scopeEnd", String.valueOf(se)));
              parts.add(new MP("srt", srt));
              parts.add(new MP("voice", "voiceover.mp3", "audio/mpeg", voice));
              JSONObject jr = new JSONObject(httpPostMultipart(BASE + "/render", parts));
              String jid = jr.optString("job", "");
              if (jid.isEmpty()) throw new Exception(jr.optString("error", "render failed"));
              JSONObject done = pollJob(BASE + "/render-job?id=" + URLEncoder.encode(jid, "UTF-8"), 240);
              if (!done.optString("status", "").equals("done")) throw new Exception(done.optString("error", "render failed"));
              String fileUrl = done.optString("file", "");
              if (fileUrl.isEmpty()) throw new Exception("render file missing");
              HttpURLConnection c = (HttpURLConnection) new URL(BASE + fileUrl).openConnection();
              c.setConnectTimeout(30000); c.setReadTimeout(300000);
              c.setRequestMethod("GET");
              if (c.getResponseCode() >= 400) throw new Exception("MP4 download failed: HTTP " + c.getResponseCode());
              ContentValues cv = new ContentValues();
              cv.put(MediaStore.Downloads.DISPLAY_NAME, outName);
              cv.put(MediaStore.Downloads.MIME_TYPE, "video/mp4");
              cv.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
              Uri out = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
              if (out == null) throw new Exception("cannot save MP4 to Downloads");
              byte[] buf = new byte[65536];
              try (InputStream in = c.getInputStream(); OutputStream os = getContentResolver().openOutputStream(out)) {
                if (os == null) throw new Exception("cannot open Downloads file");
                int n; while ((n = in.read(buf)) >= 0) os.write(buf, 0, n);
              }
              JSONObject res = new JSONObject();
              JSONObject r = new JSONObject();
              r.put("name", outName);
              res.put("render", r);
              writeResults(res);
              writeStatus("done", "render", "MP4 ရပြီးပါပြီ - Downloads မှာ သိမ်းပြီးပါပြီ", 1, 1, "");
              updateNotif("MP4 ရပြီးပါပြီ - Downloads မှာ သိမ်းပြီးပါပြီ");
            }
          }
