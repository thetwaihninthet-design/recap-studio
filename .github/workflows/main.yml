name: Build AdMob APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Check Android SDK (preinstalled on ubuntu-latest)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/build-tools" || ls /usr/lib/android-sdk/build-tools || true
      - name: Generate Android Project & Keystore
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/recapstudio/burmese app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/xml app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          cp app/src/main/assets/logo.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp app/src/main/assets/logo.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp app/src/main/assets/logo.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp app/src/main/assets/logo.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp app/src/main/assets/logo.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp app/src/main/assets/logo.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp app/src/main/assets/logo.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp app/src/main/assets/logo.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp app/src/main/assets/logo.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp app/src/main/assets/logo.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          if [ ! -f app/release-key.jks ]; then keytool -genkeypair -v -keystore app/release-key.jks -alias recapstudio -keyalg RSA -keysize 2048 -validity 10000 -storepass RecapStudio2026! -keypass RecapStudio2026! -dname "CN=Shwe Recap Studio, OU=Mobile, O=RecapStudio, L=Singapore, S=Singapore, C=SG"; else echo "Using committed release keystore - same signature, updates install over the old app"; fi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AIMovieRecapStudio"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.0' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/proguard-rules.pro
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.recapstudio.burmese'
              compileSdk 34
              defaultConfig {
                  applicationId "com.recapstudio.burmese"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              signingConfigs {
                  release {
                      storeFile file('release-key.jks')
                      storePassword 'RecapStudio2026!'
                      keyAlias 'recapstudio'
                      keyPassword 'RecapStudio2026!'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.core:core:1.13.1'
              implementation 'com.google.android.gms:play-services-ads:23.3.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="com.google.android.gms.permission.AD_ID" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <queries>
                  <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>
              </queries>
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/AppTheme">
                  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id" />
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider android:name="androidx.core.content.FileProvider" android:authorities="com.recapstudio.burmese.fileprovider" android:exported="false" android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />
                  </provider>
                  <service android:name=".RecapWorkerService" android:foregroundServiceType="dataSync" android:exported="false" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Shwe Recap Studio</string>
              <string name="admob_app_id">ca-app-pub-3940256099942544~3347511713</string>
              <string name="admob_banner_id">ca-app-pub-3940256099942544/6300978111</string>
              <string name="admob_interstitial_id">ca-app-pub-3940256099942544/1033173712</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="parts" path="parts/" />
          </paths>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">#6366F1</item>
                  <item name="colorPrimaryDark">#0B0F19</item>
                  <item name="colorAccent">#10B981</item>
                  <item name="android:statusBarColor">#0B0F19</item>
                  <item name="android:navigationBarColor">#0B0F19</item>
                  <item name="android:windowBackground">#0B0F19</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#0B0F19">
              <FrameLayout
                  android:id="@+id/nativeVideoOverlay"
                  android:layout_width="match_parent"
                  android:layout_height="240dp"
                  android:background="#000000"
                  android:visibility="gone">
                  <VideoView
                      android:id="@+id/nativeVideoView"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:layout_gravity="center" />
                  <TextView
                      android:id="@+id/btnCloseVideo"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="top|end"
                      android:layout_margin="8dp"
                      android:paddingHorizontal="10dp"
                      android:paddingVertical="4dp"
                      android:background="#AA000000"
                      android:text="ပိတ်မည် ✕"
                      android:textColor="#FFFFFF"
                      android:textSize="12sp" />
              </FrameLayout>
              <WebView android:id="@+id/webView" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" />
              <FrameLayout android:id="@+id/adBannerContainer" android:layout_width="match_parent" android:layout_height="wrap_content" android:background="#090D16" />
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:pathData="M0,0h108v108h-108z"><gradient android:type="linear" android:startX="0" android:startY="0" android:endX="108" android:endY="108" android:startColor="#8B5CF6" android:centerColor="#6D28D9" android:endColor="#2E1065" /></path></vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#00000000" android:strokeColor="#F5C542" android:strokeWidth="3" android:pathData="M24,24h60v60h-60z" /><path android:fillColor="#F5C542" android:pathData="M44,36 L72,54 L44,72 Z" /><path android:fillColor="#FFFFFF" android:pathData="M33.5,30 a2.5,2.5 0 1,0 5,0 a2.5,2.5 0 1,0 -5,0" /><path android:fillColor="#FFFFFF" android:pathData="M45.5,30 a2.5,2.5 0 1,0 5,0 a2.5,2.5 0 1,0 -5,0" /><path android:fillColor="#FFFFFF" android:pathData="M57.5,30 a2.5,2.5 0 1,0 5,0 a2.5,2.5 0 1,0 -5,0" /></vector>
          EOF

          cat << 'EOF' > app/src/main/java/com/recapstudio/burmese/MainActivity.java
          package com.recapstudio.burmese;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.OpenableColumns;
          import android.util.Base64;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.MediaController;
          import android.widget.TextView;
          import android.widget.VideoView;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.content.FileProvider;
          import com.google.android.gms.ads.*;
          import com.google.android.gms.ads.interstitial.*;
          import org.json.JSONObject;
          import java.io.*;
          import java.nio.charset.StandardCharsets;
          public class MainActivity extends AppCompatActivity {
            private WebView webView;
            private AdView bannerAdView;
            private InterstitialAd mInterstitialAd;
            private FrameLayout videoOverlay;
            private VideoView videoView;
            private static final int REQ_SCRIPT = 2001, REQ_VIDEO = 2002, REQ_FILE_CHOOSER = 2003;
            private ValueCallback<Uri[]> filePathCallback;
            private Uri lastVideoUri;
            private FileOutputStream partOut;
            private File partFile;
            @Override protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              setContentView(R.layout.activity_main);
              MobileAds.initialize(this, s -> { loadBanner(); loadInterstitial(); });
              videoOverlay = findViewById(R.id.nativeVideoOverlay);
              videoView = findViewById(R.id.nativeVideoView);
              TextView btnClose = findViewById(R.id.btnCloseVideo);
              MediaController mc = new MediaController(this);
              mc.setAnchorView(videoView);
              videoView.setMediaController(mc);
              btnClose.setOnClickListener(v -> {
                videoView.stopPlayback();
                videoOverlay.setVisibility(View.GONE);
              });
              webView = findViewById(R.id.webView);
              WebSettings ws = webView.getSettings();
              ws.setJavaScriptEnabled(true); ws.setDomStorageEnabled(true); ws.setAllowFileAccess(true); ws.setAllowContentAccess(true);
              ws.setAllowFileAccessFromFileURLs(true); ws.setAllowUniversalAccessFromFileURLs(true); ws.setMediaPlaybackRequiresUserGesture(false);
              webView.setWebViewClient(new WebViewClient());
              webView.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                  if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                  filePathCallback = callback;
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  String type = "*/*";
                  String[] types = params.getAcceptTypes();
                  if (types != null && types.length > 0 && types[0] != null && !types[0].isEmpty() && types[0].indexOf('/') >= 0) type = types[0];
                  i.setType(type);
                  if (params.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE) i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                  try { startActivityForResult(Intent.createChooser(i, "Video \u101b\u103d\u1031\u1038\u1038\u1000\u103a\u1015\u102b"), REQ_FILE_CHOOSER); } catch (Exception e) { filePathCallback = null; return false; }
                  return true;
                }
              });
              webView.addJavascriptInterface(new NativeBridge(), "AndroidApp");
              webView.loadUrl("file:///android_asset/index.html");
            }
            private void setVideoHeightByAspect(String aspect) {
              ViewGroup.LayoutParams lp = videoOverlay.getLayoutParams();
              int w = getResources().getDisplayMetrics().widthPixels;
              if ("9:16".equals(aspect)) {
                lp.height = Math.min((int)(w * 1.15f), 460);
              } else if ("4:5".equals(aspect)) {
                lp.height = Math.min((int)(w * 1.0f), 400);
              } else {
                lp.height = (int)(w * 9f / 16f);
              }
              videoOverlay.setLayoutParams(lp);
            }
            private void playVideoUri(Uri uri) {
              runOnUiThread(() -> {
                try {
                  videoOverlay.setVisibility(View.VISIBLE);
                  setVideoHeightByAspect("9:16");
                  videoView.stopPlayback();
                  videoView.setVideoURI(uri);
                  videoView.start();
                } catch (Exception ignored) {}
              });
            }
            private void loadBanner() {
              FrameLayout box = findViewById(R.id.adBannerContainer);
              if (box == null) return;
              bannerAdView = new AdView(this);
              bannerAdView.setAdUnitId(getString(R.string.admob_banner_id));
              bannerAdView.setAdSize(AdSize.BANNER);
              box.removeAllViews(); box.addView(bannerAdView);
              bannerAdView.loadAd(new AdRequest.Builder().build());
            }
            private void loadInterstitial() {
              InterstitialAd.load(this, getString(R.string.admob_interstitial_id), new AdRequest.Builder().build(), new InterstitialAdLoadCallback() {
                @Override public void onAdLoaded(@NonNull InterstitialAd ad) { mInterstitialAd = ad; mInterstitialAd.setFullScreenContentCallback(new FullScreenContentCallback() { @Override public void onAdDismissedFullScreenContent() { mInterstitialAd = null; loadInterstitial(); } }); }
                @Override public void onAdFailedToLoad(@NonNull LoadAdError err) { mInterstitialAd = null; }
              });
            }
            public class NativeBridge {
              @JavascriptInterface public void pickScriptFile() { Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT); i.addCategory(Intent.CATEGORY_OPENABLE); i.setType("*/*"); startActivityForResult(i, REQ_SCRIPT); }
              @JavascriptInterface public void pickRenderVideo() { Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT); i.addCategory(Intent.CATEGORY_OPENABLE); i.setType("video/*"); startActivityForResult(i, REQ_VIDEO); }
              @JavascriptInterface public void setAspect(String aspect) { runOnUiThread(() -> setVideoHeightByAspect(aspect)); }
              @JavascriptInterface public void showAdNow() { runOnUiThread(() -> { if (mInterstitialAd != null) mInterstitialAd.show(MainActivity.this); else loadInterstitial(); }); }
              @JavascriptInterface public void shareVideo(String prompt) {
                runOnUiThread(() -> {
                  try {
                    if (lastVideoUri == null) { webView.evaluateJavascript("onShareUnavailable('no-video');", null); return; }
                    Intent send = new Intent(Intent.ACTION_SEND);
                    send.setType("video/*");
                    send.putExtra(Intent.EXTRA_STREAM, lastVideoUri);
                    send.putExtra(Intent.EXTRA_TEXT, prompt == null ? "" : prompt);
                    send.putExtra(Intent.EXTRA_SUBJECT, "Movie Recap — AI Prompt");
                    send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                    startActivity(Intent.createChooser(send, "Share to AI"));
                  } catch (Exception e) {
                    webView.evaluateJavascript("onShareUnavailable('error');", null);
                  }
                });
              }
              @JavascriptInterface public void beginPartFile(String name) {
                try {
                  File dir = new File(getCacheDir(), "parts");
                  if (!dir.exists()) dir.mkdirs();
                  File[] old = dir.listFiles();
                  if (old != null) for (File f : old) { try { f.delete(); } catch (Exception ignored) {} }
                  partFile = new File(dir, name == null || name.isEmpty() ? "movie-recap-part.mp4" : name);
                  partOut = new FileOutputStream(partFile, false);
                } catch (Exception e) { partFile = null; partOut = null; }
              }
              @JavascriptInterface public void writePartChunk(String base64) {
                try {
                  if (partOut == null || base64 == null) return;
                  byte[] data = Base64.decode(base64, Base64.DEFAULT);
                  partOut.write(data);
                } catch (Exception ignored) {}
              }
              @JavascriptInterface public void endPartFile(final String prompt) {
                try { if (partOut != null) { partOut.flush(); partOut.close(); } } catch (Exception ignored) {}
                partOut = null;
                sharePartFile(prompt);
              }
              @JavascriptInterface public void shareLastPart(final String prompt) { sharePartFile(prompt); }
              @JavascriptInterface public void shareText(final String text) {
                runOnUiThread(() -> {
                  try {
                    Intent send = new Intent(Intent.ACTION_SEND);
                    send.setType("text/plain");
                    send.putExtra(Intent.EXTRA_TEXT, text == null ? "" : text);
                    send.putExtra(Intent.EXTRA_SUBJECT, "Movie Recap — Subtitle");
                    startActivity(Intent.createChooser(send, "Share to AI"));
                  } catch (Exception e) {
                    webView.evaluateJavascript("onTextShareFailed();", null);
                  }
                });
              }
              @JavascriptInterface public void openGemini() {
                runOnUiThread(() -> {
                  try {
                    Intent i = getPackageManager().getLaunchIntentForPackage("com.google.android.apps.bard");
                    if (i != null) { startActivity(i); return; }
                  } catch (Exception ignored) {}
                  try {
                    Intent v = new Intent(Intent.ACTION_VIEW, Uri.parse("https://gemini.google.com/app"));
                    startActivity(v);
                  } catch (Exception ignored) {}
                });
              }
              @JavascriptInterface public void startBgJob(String jobJson) {
                try {
                  Intent i = new Intent(MainActivity.this, RecapWorkerService.class);
                  i.putExtra("job", jobJson == null ? "" : jobJson);
                  if (android.os.Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
                } catch (Exception ignored) {}
              }
              @JavascriptInterface public void stopBgJob() {
                try {
                  File d = new File(getCacheDir(), "recap-bg"); if (!d.exists()) d.mkdirs();
                  JSONObject o = new JSONObject();
                  o.put("state", "stopped"); o.put("kind", ""); o.put("label", "");
                  o.put("done", 0); o.put("total", 0); o.put("error", "");
                  o.put("at", System.currentTimeMillis());
                  File tmp = new File(d, "status.json.tmp");
                  try (java.io.OutputStream os = new java.io.FileOutputStream(tmp)) { os.write(o.toString().getBytes(StandardCharsets.UTF_8)); }
                  tmp.renameTo(new File(d, "status.json"));
                } catch (Exception ignored) {}
                try { stopService(new Intent(MainActivity.this, RecapWorkerService.class)); } catch (Exception ignored) {}
              }
              @JavascriptInterface public String getBgStatus() { return readBgJson("status.json"); }
              @JavascriptInterface public String getBgResults() { return readBgJson("results.json"); }
              @JavascriptInterface public String getSavedVideo() {
                try {
                  SharedPreferences sp = getSharedPreferences("recap-prefs", MODE_PRIVATE);
                  JSONObject o = new JSONObject();
                  o.put("uri", sp.getString("video-uri", ""));
                  o.put("name", sp.getString("video-name", ""));
                  o.put("size", sp.getLong("video-size", 0));
                  return o.toString();
                } catch (Exception e) { return "{}"; }
              }
              @JavascriptInterface public void closePartFile() { try { if (partOut != null) { partOut.flush(); partOut.close(); } } catch (Exception ignored) {} partOut = null; }
              private String readBgJson(String name) {
                try {
                  File f = new File(new File(getCacheDir(), "recap-bg"), name);
                  if (!f.exists()) return "{}";
                  byte[] b = new byte[(int) f.length()];
                  try (FileInputStream in = new FileInputStream(f)) { int n = 0, r; while (n < b.length && (r = in.read(b, n, b.length - n)) >= 0) n += r; }
                  return new String(b, StandardCharsets.UTF_8);
                } catch (Exception e) { return "{}"; }
              }
              private void sharePartFile(final String prompt) {
                runOnUiThread(() -> {
                  try {
                    if (partFile == null || !partFile.exists() || partFile.length() == 0) { webView.evaluateJavascript("onPartShareFailed();", null); return; }
                    Uri uri = FileProvider.getUriForFile(MainActivity.this, "com.recapstudio.burmese.fileprovider", partFile);
                    Intent send = new Intent(Intent.ACTION_SEND);
                    String shareType = "video/*";
                    String partName = partFile.getName().toLowerCase();
                    if (partName.endsWith(".jpg") || partName.endsWith(".jpeg") || partName.endsWith(".png")) shareType = "image/*";
                    else if (partName.endsWith(".pdf")) shareType = "application/pdf";
                    else if (partName.indexOf("-audio.") >= 0) shareType = "audio/*";
                    send.setType(shareType);
                    send.putExtra(Intent.EXTRA_STREAM, uri);
                    send.putExtra(Intent.EXTRA_TEXT, prompt == null ? "" : prompt);
                    send.putExtra(Intent.EXTRA_SUBJECT, "Movie Recap — AI Prompt");
                    send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                    startActivity(Intent.createChooser(send, "Share to AI"));
                  } catch (Exception e) {
                    webView.evaluateJavascript("onPartShareFailed();", null);
                  }
                });
              }
            }
            @Override protected void onActivityResult(int req, int res, Intent data) {
              super.onActivityResult(req, res, data);
              if (req == REQ_FILE_CHOOSER) {
                if (filePathCallback == null) return;
                Uri[] results = null;
                if (res == Activity.RESULT_OK && data != null) {
                  if (data.getClipData() != null) {
                    int n = data.getClipData().getItemCount();
                    results = new Uri[n];
                    for (int k = 0; k < n; k++) results[k] = data.getClipData().getItemAt(k).getUri();
                  } else if (data.getData() != null) {
                    results = new Uri[]{ data.getData() };
                  }
                  if (results != null) {
                    for (Uri u : results) {
                      try { getContentResolver().takePersistableUriPermission(u, Intent.FLAG_GRANT_READ_URI_PERMISSION); } catch (Exception ignored) {}
                    }
                  }
                  if (results != null && results.length > 0 && results[0] != null) {
                    lastVideoUri = results[0];
                    try {
                      SharedPreferences sp = getSharedPreferences("recap-prefs", MODE_PRIVATE);
                      SharedPreferences.Editor ed = sp.edit();
                      ed.putString("video-uri", lastVideoUri.toString());
                      try (Cursor c = getContentResolver().query(lastVideoUri, null, null, null, null)) {
                        if (c != null && c.moveToFirst()) {
