name: Build AdMob APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Check Android SDK (preinstalled on ubuntu-latest)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/build-tools" || ls /usr/lib/android-sdk/build-tools || true
      - name: Generate Android Project & Keystore
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/recapstudio/burmese app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          keytool -genkeypair -v -keystore app/release-key.jks -alias recapstudio -keyalg RSA -keysize 2048 -validity 10000 -storepass RecapStudio2026! -keypass RecapStudio2026! -dname "CN=AI Movie Recap Studio, OU=Mobile, O=RecapStudio, L=Singapore, S=Singapore, C=SG"

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AIMovieRecapStudio"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.0' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/proguard-rules.pro
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.recapstudio.burmese'
              compileSdk 34
              defaultConfig {
                  applicationId "com.recapstudio.burmese"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              signingConfigs {
                  release {
                      storeFile file('release-key.jks')
                      storePassword 'RecapStudio2026!'
                      keyAlias 'recapstudio'
                      keyPassword 'RecapStudio2026!'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
