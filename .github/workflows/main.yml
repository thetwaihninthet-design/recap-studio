name: Build AdMob APK & AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Android Project & Keystore
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/recapstudio/burmese app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          keytool -genkeypair -v -keystore app/release-key.jks -alias recapstudio -keyalg RSA -keysize 2048 -validity 10000 -storepass RecapStudio2026! -keypass RecapStudio2026! -dname "CN=AI Movie Recap Studio, OU=Mobile, O=RecapStudio, L=Singapore, S=Singapore, C=SG"
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AIMovieRecapStudio"
          include ':app'
          EOF
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.0' apply false
          }
          EOF
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          cat << 'EOF' > app/proguard-rules.pro
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          EOF
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.recapstudio.burmese'
              compileSdk 34
              defaultConfig {
                  applicationId "com.recapstudio.burmese"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              signingConfigs {
                  release {
                      storeFile file('release-key.jks')
                      storePassword 'RecapStudio2026!'
                      keyAlias 'recapstudio'
                      keyPassword 'RecapStudio2026!'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.gms:play-services-ads:23.3.0'
          }
          EOF
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <uses-permission android:name="com.google.android.gms.permission.AD_ID" />
              <queries>
                  <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>
              </queries>
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/AppTheme">
                  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id" />
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AI Movie Recap Studio</string>
              <string name="admob_app_id">ca-app-pub-3940256099942544~3347511713</string>
              <string name="admob_banner_id">ca-app-pub-3940256099942544/6300978111</string>
              <string name="admob_interstitial_id">ca-app-pub-3940256099942544/1033173712</string>
          </resources>
          EOF
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">#6366F1</item>
                  <item name="colorPrimaryDark">#0B0F19</item>
                  <item name="colorAccent">#10B981</item>
                  <item name="android:statusBarColor">#0B0F19</item>
                  <item name="android:navigationBarColor">#0B0F19</item>
                  <item name="android:windowBackground">#0B0F19</item>
              </style>
          </resources>
          EOF
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#0B0F19">
              <WebView android:id="@+id/webView" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" />
              <FrameLayout android:id="@+id/adBannerContainer" android:layout_width="match_parent" android:layout_height="wrap_content" android:background="#090D16" />
          </LinearLayout>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#1E1B4B" android:pathData="M0,0h108v108h-108z" /></vector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#6366F1" android:pathData="M40,34 L74,54 L40,74 Z" /></vector>
          EOF
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background" /><foreground android:drawable="@drawable/ic_launcher_foreground" /></adaptive-icon>
          EOF
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background" /><foreground android:drawable="@drawable/ic_launcher_foreground" /></adaptive-icon>
          EOF
          cat << 'EOF' > app/src/main/java/com/recapstudio/burmese/MainActivity.java
          package com.recapstudio.burmese;
          import android.app.Activity;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.OpenableColumns;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import com.google.android.gms.ads.*;
          import com.google.android.gms.ads.interstitial.*;
          import org.json.JSONObject;
          import java.io.*;
          import java.nio.charset.StandardCharsets;
          public class MainActivity extends AppCompatActivity {
            private WebView webView;
            private AdView bannerAdView;
            private InterstitialAd mInterstitialAd;
            private static final int REQ_SCRIPT = 2001, REQ_VIDEO = 2002;
            @Override protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              setContentView(R.layout.activity_main);
              MobileAds.initialize(this, s -> { loadBanner(); loadInterstitial(); });
              webView = findViewById(R.id.webView);
              WebSettings ws = webView.getSettings();
              ws.setJavaScriptEnabled(true); ws.setDomStorageEnabled(true); ws.setAllowFileAccess(true); ws.setAllowContentAccess(true);
              webView.setWebViewClient(new WebViewClient());
              webView.addJavascriptInterface(new NativeBridge(), "AndroidApp");
              webView.loadUrl("file:///android_asset/index.html");
            }
            private void loadBanner() {
              FrameLayout box = findViewById(R.id.adBannerContainer);
              if (box == null) return;
              bannerAdView = new AdView(this);
              bannerAdView.setAdUnitId(getString(R.string.admob_banner_id));
              bannerAdView.setAdSize(AdSize.BANNER);
              box.removeAllViews(); box.addView(bannerAdView);
              bannerAdView.loadAd(new AdRequest.Builder().build());
            }
            private void loadInterstitial() {
              InterstitialAd.load(this, getString(R.string.admob_interstitial_id), new AdRequest.Builder().build(), new InterstitialAdLoadCallback() {
                @Override public void onAdLoaded(@NonNull InterstitialAd ad) { mInterstitialAd = ad; mInterstitialAd.setFullScreenContentCallback(new FullScreenContentCallback() { @Override public void onAdDismissedFullScreenContent() { mInterstitialAd = null; loadInterstitial(); } }); }
                @Override public void onAdFailedToLoad(@NonNull LoadAdError err) { mInterstitialAd = null; }
              });
            }
            public class NativeBridge {
              @JavascriptInterface public void pickScriptFile() { Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT); i.addCategory(Intent.CATEGORY_OPENABLE); i.setType("*/*"); startActivityForResult(i, REQ_SCRIPT); }
              @JavascriptInterface public void pickRenderVideo() { Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT); i.addCategory(Intent.CATEGORY_OPENABLE); i.setType("video/*"); startActivityForResult(i, REQ_VIDEO); }
              @JavascriptInterface public void showAdNow() { runOnUiThread(() -> { if (mInterstitialAd != null) mInterstitialAd.show(MainActivity.this); else loadInterstitial(); }); }
            }
            @Override protected void onActivityResult(int req, int res, Intent data) {
              super.onActivityResult(req, res, data);
              if (res != Activity.RESULT_OK || data == null || data.getData() == null) return;
              Uri uri = data.getData(); String name = "file";
              try (Cursor c = getContentResolver().query(uri, null, null, null, null)) { if (c != null && c.moveToFirst()) { int idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME); if (idx >= 0) name = c.getString(idx); } } catch (Exception ignored) {}
              try {
                JSONObject info = new JSONObject(); info.put("name", name);
                if (req == REQ_SCRIPT && !name.toLowerCase().matches(".*\\.(mp4|mov|mkv|webm)$")) {
                  StringBuilder sb = new StringBuilder();
                  try (InputStream is = getContentResolver().openInputStream(uri); BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8))) { String l; while ((l = br.readLine()) != null) sb.append(l).append("\n"); }
                  info.put("text", sb.toString());
                }
                final String q = JSONObject.quote(info.toString());
                final String fn = (req == REQ_SCRIPT) ? "onScriptFileChosen" : "onRenderVideoChosen";
                runOnUiThread(() -> webView.evaluateJavascript(fn + "(" + q + ");", null));
              } catch (Exception ignored) {}
            }
            @Override protected void onPause() { if (bannerAdView != null) bannerAdView.pause(); super.onPause(); }
            @Override protected void onResume() { super.onResume(); if (bannerAdView != null) bannerAdView.resume(); }
            @Override protected void onDestroy() { if (bannerAdView != null) bannerAdView.destroy(); super.onDestroy(); }
          }
          EOF
          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html><html lang="my"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>AI Movie Recap Studio</title><style>body{margin:0;background:#0b0f19;color:#f1f5f9;font-family:sans-serif;padding:14px}.card{background:#141b2d;border:1px solid #25304a;border-radius:14px;padding:14px;margin-bottom:14px}input,select,textarea{width:100%;background:#090d16;border:1px solid #25304a;color:#fff;border-radius:10px;padding:10px;margin-bottom:10px;box-sizing:border-box}textarea{min-height:110px}.btn{width:100%;padding:12px;border:none;border-radius:10px;background:#6366f1;color:#fff;font-weight:bold;font-size:14px;margin-top:6px}.file-box{border:2px dashed #25304a;border-radius:10px;padding:12px;text-align:center;margin-bottom:10px}.status{color:#34d399;font-size:13px;margin-top:8px;text-align:center}</style></head><body><div class="card"><h3>AI Movie Recap Studio</h3><input type="password" id="apiKey" placeholder="Gemini API Key (AIzaSy...)" oninput="localStorage.setItem('gkey',this.value)" /><div class="file-box" onclick="AndroidApp.pickScriptFile()"><div id="fLabel">စာတန်းဖိုင် (.SRT / .TXT) ရွေးပါ</div></div><textarea id="srcText" placeholder="ဇာတ်ကြောင်းစာသား ထည့်ပါ..."></textarea><button class="btn" onclick="genScript()">မြန်မာ Recap Script ရေးမည်</button><div class="status" id="st1"></div></div><div class="card"><textarea id="mmText" placeholder="မြန်မာစာသား ထွက်လာမည်..."></textarea><button class="btn" onclick="speakMm()">မြန်မာအသံ ဖတ်ပြမည်</button></div><div class="card"><div class="file-box" onclick="AndroidApp.pickRenderVideo()"><div id="vLabel">Gallery မှ Video ရွေးပါ</div></div><select id="aspect"><option value="9:16">9:16 (TikTok / Shorts / Reels)</option><option value="16:9">16:9 (YouTube)</option><option value="4:5">4:5 (Facebook)</option></select><button class="btn" onclick="doneRender()">ကြော်ငြာကြည့်ပြီး အဆုံးသတ်မည်</button><div class="status" id="st2"></div></div><script>window.onload=()=>{if(localStorage.getItem('gkey'))document.getElementById('apiKey').value=localStorage.getItem('gkey')};function onScriptFileChosen(j){const d=JSON.parse(j);document.getElementById('fLabel').innerText=d.name;if(d.text)document.getElementById('srcText').value=d.text}function onRenderVideoChosen(j){const d=JSON.parse(j);document.getElementById('vLabel').innerText=d.name}async function genScript(){const key=document.getElementById('apiKey').value.trim();const txt=document.getElementById('srcText').value.trim();if(!key||!txt){document.getElementById('st1').innerText='API Key နဲ့ စာသား ထည့်ပါ';return}document.getElementById('st1').innerText='ရေးနေပါသည်...';const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'Rewrite into engaging spoken Burmese movie recap narration only:\n'+txt}]}]})});const d=await r.json();document.getElementById('mmText').value=d.candidates?.[0]?.content?.parts?.[0]?.text||'Error';document.getElementById('st1').innerText='ပြီးပါပြီ';if(window.AndroidApp)AndroidApp.showAdNow()}function speakMm(){const u=new SpeechSynthesisUtterance(document.getElementById('mmText').value);u.lang='my-MM';speechSynthesis.speak(u)}function doneRender(){document.getElementById('st2').innerText='အဆင်သင့်ဖြစ်ပါပြီ';if(window.AndroidApp)AndroidApp.showAdNow()}</script></body></html>
          EOF
      - run: gradle assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: RecapStudio-Phone-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RecapStudio-PlayStore-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          
