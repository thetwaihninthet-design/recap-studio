                  android.media.MediaFormat f = ex.getTrackFormat(i);
                  String mime = f.getString(android.media.MediaFormat.KEY_MIME);
                  if (mime != null && mime.startsWith("audio/")) { audioTrack = i; fmt = f; break; }
                }
                if (audioTrack < 0) throw new Exception("video မှာ အသံမရှိပါ");
                ex.selectTrack(audioTrack);
                long startUs = (long) (startSec * 1000000L);
                long endUs = (long) (endSec * 1000000L);
                ex.seekTo(startUs, android.media.MediaExtractor.SEEK_TO_PREVIOUS_SYNC);
                File dir = new File(getCacheDir(), "parts");
                if (!dir.exists()) dir.mkdirs();
                File out = new File(dir, "part-audio-" + pi + ".m4a");
                android.media.MediaMuxer mux = new android.media.MediaMuxer(out.getAbsolutePath(), android.media.MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4);
                int outTrack = mux.addTrack(fmt);
                mux.start();
                java.nio.ByteBuffer buf = java.nio.ByteBuffer.allocate(512 * 1024);
                android.media.MediaCodec.BufferInfo info = new android.media.MediaCodec.BufferInfo();
                long written = 0;
                while (true) {
                  int n = ex.readSampleData(buf, 0);
                  if (n < 0) break;
                  long t = ex.getSampleTime();
                  if (t > endUs) break;
                  info.set(0, n, t, ex.getSampleFlags());
                  mux.writeSampleData(outTrack, buf, info);
                  written += n;
                  ex.advance();
                }
                mux.stop();
                mux.release();
                if (written == 0 || out.length() < 1024) throw new Exception("အပိုင်း " + (pi + 1) + " မှာ အသံမရှိပါ");
                return out;
              } finally {
                try { ex.release(); } catch (Exception ignored) {}
              }
            }

            private File transcodePartAudio(Uri uri, double startSec, double endSec, int pi) throws Exception {
              android.media.MediaExtractor ex = new android.media.MediaExtractor();
              android.media.MediaCodec dec = null, enc = null;
              android.media.MediaMuxer mux = null;
              try {
                ex.setDataSource(this, uri, null);
                int audioTrack = -1;
                android.media.MediaFormat fmt = null;
                for (int i = 0; i < ex.getTrackCount(); i++) {
                  android.media.MediaFormat f = ex.getTrackFormat(i);
                  String mm = f.getString(android.media.MediaFormat.KEY_MIME);
                  if (mm != null && mm.startsWith("audio/")) { audioTrack = i; fmt = f; break; }
                }
                if (audioTrack < 0) throw new Exception("video မှာ အသံမရှိပါ");
                String mime = fmt.getString(android.media.MediaFormat.KEY_MIME);
                int sampleRate = fmt.containsKey(android.media.MediaFormat.KEY_SAMPLE_RATE) ? fmt.getInteger(android.media.MediaFormat.KEY_SAMPLE_RATE) : 44100;
                int channels = fmt.containsKey(android.media.MediaFormat.KEY_CHANNEL_COUNT) ? fmt.getInteger(android.media.MediaFormat.KEY_CHANNEL_COUNT) : 2;
                if (channels > 2) channels = 2;
                ex.selectTrack(audioTrack);
                long startUs = (long) (startSec * 1000000L);
                long endUs = (long) (endSec * 1000000L);
                ex.seekTo(startUs, android.media.MediaExtractor.SEEK_TO_PREVIOUS_SYNC);
                dec = android.media.MediaCodec.createDecoderByType(mime);
                dec.configure(fmt, null, null, 0);
                android.media.MediaFormat encFmt = android.media.MediaFormat.createAudioFormat(android.media.MediaFormat.MIMETYPE_AUDIO_AAC, sampleRate, channels);
                encFmt.setInteger(android.media.MediaFormat.KEY_BIT_RATE, 32000);
                encFmt.setInteger(android.media.MediaFormat.KEY_AAC_PROFILE, android.media.MediaCodecInfo.CodecProfileLevel.AACObjectLC);
                enc = android.media.MediaCodec.createEncoderByType(android.media.MediaFormat.MIMETYPE_AUDIO_AAC);
                enc.configure(encFmt, null, null, android.media.MediaCodec.CONFIGURE_FLAG_ENCODE);
                File dir = new File(getCacheDir(), "parts");
                if (!dir.exists()) dir.mkdirs();
                File out = new File(dir, "part-audio-" + pi + "-low.m4a");
                mux = new android.media.MediaMuxer(out.getAbsolutePath(), android.media.MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4);
                dec.start();
                enc.start();
                int outTrack = -1;
                boolean muxStarted = false;
                boolean decDone = false, encDone = false;
                long baseUs = -1;
                long t0 = System.currentTimeMillis();
                android.media.MediaCodec.BufferInfo info = new android.media.MediaCodec.BufferInfo();
                while (!encDone) {
                  if (System.currentTimeMillis() - t0 > 300000) throw new Exception("audio transcode timeout");
                  if (!decDone) {
                    int inIdx = dec.dequeueInputBuffer(10000);
                    if (inIdx >= 0) {
                      java.nio.ByteBuffer inBuf = dec.getInputBuffer(inIdx);
                      int n = ex.readSampleData(inBuf, 0);
                      if (n < 0 || ex.getSampleTime() > endUs) {
                        dec.queueInputBuffer(inIdx, 0, 0, 0, android.media.MediaCodec.BUFFER_FLAG_END_OF_STREAM);
                        decDone = true;
                      } else {
                        long tt = ex.getSampleTime();
                        dec.queueInputBuffer(inIdx, 0, n, tt, 0);
                        ex.advance();
                      }
                    }
                  }
                  int decOut = dec.dequeueOutputBuffer(info, 10000);
                  if (decOut >= 0) {
                    java.nio.ByteBuffer pcm = dec.getOutputBuffer(decOut);
                    if ((info.flags & android.media.MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) {
                      int encIn = enc.dequeueInputBuffer(10000);
                      if (encIn >= 0) enc.queueInputBuffer(encIn, 0, 0, 0, android.media.MediaCodec.BUFFER_FLAG_END_OF_STREAM);
                    } else if (info.size > 0) {
                      int encIn = enc.dequeueInputBuffer(10000);
                      if (encIn >= 0) {
                        java.nio.ByteBuffer encBuf = enc.getInputBuffer(encIn);
                        encBuf.clear();
                        pcm.position(info.offset);
                        pcm.limit(info.offset + info.size);
                        encBuf.put(pcm);
                        enc.queueInputBuffer(encIn, 0, info.size, info.presentationTimeUs, 0);
                      }
                    }
                    dec.releaseOutputBuffer(decOut, false);
                  }
                  int encOut = enc.dequeueOutputBuffer(info, 10000);
                  if (encOut == android.media.MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                    if (!muxStarted) {
                      outTrack = mux.addTrack(enc.getOutputFormat());
                      mux.start();
                      muxStarted = true;
                    }
                  } else if (encOut >= 0) {
                    if ((info.flags & android.media.MediaCodec.BUFFER_FLAG_CODEC_CONFIG) != 0) {
                      enc.releaseOutputBuffer(encOut, false);
                    } else {
                      if (!muxStarted) {
                        outTrack = mux.addTrack(enc.getOutputFormat());
                        mux.start();
                        muxStarted = true;
                      }
                      if (info.size > 0) {
                        java.nio.ByteBuffer ob = enc.getOutputBuffer(encOut);
                        if (baseUs < 0) baseUs = info.presentationTimeUs;
                        info.presentationTimeUs = info.presentationTimeUs - baseUs;
                        ob.position(info.offset);
                        ob.limit(info.offset + info.size);
                        mux.writeSampleData(outTrack, ob, info);
                      }
                      if ((info.flags & android.media.MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) encDone = true;
                      enc.releaseOutputBuffer(encOut, false);
                    }
                  }
                }
                if (muxStarted) { try { mux.stop(); } catch (Exception ignored) {} }
                if (!muxStarted || out.length() < 1024) throw new Exception("audio transcode failed");
                return out;
              } finally {
                try { if (mux != null) mux.release(); } catch (Exception ignored) {}
                try { if (enc != null) { enc.stop(); enc.release(); } } catch (Exception ignored) {}
                try { if (dec != null) { dec.stop(); dec.release(); } } catch (Exception ignored) {}
                try { ex.release(); } catch (Exception ignored) {}
              }
            }

            private File extractPartAudio(Uri uri, double startSec, double endSec, int pi) throws Exception {
              try {
                return transcodePartAudio(uri, startSec, endSec, pi);
              } catch (Exception e) {
                return copyPartAudio(uri, startSec, endSec, pi);
              }
            }
            private void transcribeAll(JSONObject job, String uid, long totalSize) throws Exception {
              JSONArray parts = job.getJSONArray("parts");
              String key = job.optString("licenseKey", ""); if (key.isEmpty()) key = job.optString("geminiKey", "");
              SharedPreferences sp = getSharedPreferences("recap-prefs", MODE_PRIVATE);
              String uriStr = sp.getString("video-uri", "");
              if (uriStr == null || uriStr.isEmpty()) throw new Exception("video not saved on phone - pick the video again");
              Uri uri = Uri.parse(uriStr);
              writeResults(new JSONObject().put("uploadId", uid));
              JSONObject all = new JSONObject();
              java.util.List<Integer> failed = new java.util.ArrayList<>();
              for (int i = 0; i < parts.length(); i++) {
                JSONObject p = parts.getJSONObject(i);
                int pi = p.getInt("pi");
                double ps = p.getDouble("start"), pe = p.getDouble("end");
                updateNotif("အပိုင်း " + (pi + 1) + " စာသားထုတ်နေတယ် ခဏစောင့်ပါ — Extracting text, please wait (" + (i + 1) + "/" + parts.length() + ")");
                writeStatus("running", "transcribe-all", "အသံ ဖြတ်နေပါတယ်", i, parts.length(), "");
                File audio = extractPartAudio(uri, ps, pe, pi);
                JSONObject done = null;
                String lastErr = "transcribe failed";
                for (int attempt = 0; attempt < 3; attempt++) {
                  if (attempt > 0) {
                    updateNotif("အပိုင်း " + (pi + 1) + " ပြန်စမ်းနေပါတယ်… (" + (attempt + 1) + "/3)");
                    writeStatus("running", "transcribe-all", "ပြန်စမ်းနေပါတယ် (" + (attempt + 1) + "/3)", i, parts.length(), "");
                    try { Thread.sleep(attempt == 1 ? 30000 : 60000); } catch (InterruptedException ie) { Thread.currentThread().interrupt(); throw new Exception("cancelled"); }
                  }
                  try {
                    java.util.List<MP> mp = new java.util.ArrayList<>();
                    mp.add(new MP("audio", "part-audio.m4a", "audio/mp4", audio));
                    mp.add(new MP("partStart", String.valueOf(ps)));
                    if (!key.isEmpty()) mp.add(new MP("licenseKey", key));
                    try { String devId = android.provider.Settings.Secure.getString(getContentResolver(), android.provider.Settings.Secure.ANDROID_ID); if (devId != null && !devId.isEmpty()) mp.add(new MP("deviceId", devId)); } catch (Exception ignored) {}
                    writeStatus("running", "transcribe-all", "အသံ တင်နေပါတယ်", i, parts.length(), "");
                    JSONObject jr = new JSONObject(httpPostMultipart(BASE + "/transcribe", mp));
                    String jid = jr.optString("job", "");
                    if (jid.isEmpty()) throw new Exception(jr.optString("error", "transcribe failed"));
                    writeStatus("running", "transcribe-all", "စာသားထုတ်နေတယ် ခဏစောင့်ပါ — Extracting text, please wait", i, parts.length(), "");
                    JSONObject d = pollJob(BASE + "/transcribe-job?id=" + URLEncoder.encode(jid, "UTF-8"), 120);
                    if (!d.optString("status", "").equals("done")) throw new Exception(d.optString("error", "transcribe failed"));
                    done = d;
                    break;
                  } catch (Exception e) {
                    lastErr = e.getMessage() == null ? "transcribe failed" : e.getMessage();
                    boolean transientErr = lastErr.indexOf("503") >= 0 || lastErr.indexOf("Service Unavailable") >= 0 || lastErr.indexOf("timed out") >= 0 || lastErr.indexOf("HTTP Error 5") >= 0;
                    if (!transientErr) break;
                  }
                }
                if (done == null) { failed.add(pi); try { audio.delete(); } catch (Exception ignored) {} continue; }
                JSONObject rec = new JSONObject();
                rec.put("lines", done.optJSONArray("lines") == null ? new JSONArray() : done.getJSONArray("lines"));
                rec.put("srt", done.optString("srt", ""));
                all.put("part" + pi, rec);
                JSONObject res = new JSONObject();
                res.put("transcripts", all);
                writeResults(res);
                try { audio.delete(); } catch (Exception ignored) {}
              }
              if (!failed.isEmpty()) {
                StringBuilder fb = new StringBuilder();
                for (int k = 0; k < failed.size(); k++) { if (k > 0) fb.append(", "); fb.append(failed.get(k) + 1); }
                String fmsg = "အပိုင်း " + fb.toString() + " စာသား မရပါ — ကျန်အပိုင်း သိမ်းပြီးပါပြီ, 🌙 ပြန်နှိပ်ရင် မရသေးတာပဲ လုပ်မယ်";
                writeStatus("error", "transcribe-all", "", parts.length(), parts.length(), fmsg);
                updateNotif(fmsg);
                return;
              }
              writeStatus("done", "transcribe-all", "စာသား အကုန် ရပြီးပါပြီ", parts.length(), parts.length(), "");
              updateNotif("စာသား အကုန် ရပြီးပါပြီ");
            }

            private void render(JSONObject job, String uid) throws Exception {
              double ss = job.getDouble("scopeStart"), se = job.getDouble("scopeEnd");
              String srt = job.optString("srt", "");
              String voiceName = job.optString("voiceFile", "voiceover.mp3");
              String outName = job.optString("outName", "movie-recap.mp4");
              String scope = job.optString("scope", "all");
              File voice = new File(new File(getCacheDir(), "parts"), voiceName);
              if (!voice.exists() || voice.length() == 0) throw new Exception("voice file missing - generate the voice first");
              updateNotif("Server မှာ MP4 ထုတ်နေပါတယ်…");
              writeStatus("running", "render", "render", 0, 1, "");
              java.util.List<MP> parts = new java.util.ArrayList<>();
              parts.add(new MP("uploadId", uid));
              parts.add(new MP("scopeStart", String.valueOf(ss)));
              parts.add(new MP("scopeEnd", String.valueOf(se)));
              parts.add(new MP("srt", srt));
              parts.add(new MP("voice", "voiceover.mp3", "audio/mpeg", voice));
              JSONObject jr = new JSONObject(httpPostMultipart(BASE + "/render", parts));
              String jid = jr.optString("job", "");
              if (jid.isEmpty()) throw new Exception(jr.optString("error", "render failed"));
              JSONObject done = pollJob(BASE + "/render-job?id=" + URLEncoder.encode(jid, "UTF-8"), 240);
              if (!done.optString("status", "").equals("done")) throw new Exception(done.optString("error", "render failed"));
              String fileUrl = done.optString("file", "");
              if (fileUrl.isEmpty()) throw new Exception("render file missing");
              HttpURLConnection c = (HttpURLConnection) new URL(BASE + fileUrl).openConnection();
              c.setConnectTimeout(30000); c.setReadTimeout(300000);
              c.setRequestMethod("GET");
              if (c.getResponseCode() >= 400) throw new Exception("MP4 download failed: HTTP " + c.getResponseCode());
              ContentValues cv = new ContentValues();
              cv.put(MediaStore.Downloads.DISPLAY_NAME, outName);
              cv.put(MediaStore.Downloads.MIME_TYPE, "video/mp4");
              cv.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
              Uri out = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
              if (out == null) throw new Exception("cannot save MP4 to Downloads");
              byte[] buf = new byte[65536];
              try (InputStream in = c.getInputStream(); OutputStream os = getContentResolver().openOutputStream(out)) {
                if (os == null) throw new Exception("cannot open Downloads file");
                int n; while ((n = in.read(buf)) >= 0) os.write(buf, 0, n);
              }
              JSONObject res = new JSONObject();
              JSONObject r = new JSONObject();
              r.put("name", outName);
              r.put("scope", scope);
              res.put("render", r);
              writeResults(res);
              writeStatus("done", "render", "MP4 ရပြီးပါပြီ - Downloads မှာ သိမ်းပြီးပါပြီ", 1, 1, "");
              updateNotif("MP4 ရပြီးပါပြီ - Downloads မှာ သိမ်းပြီးပါပြီ");
            }
          }
          EOF

          if [ ! -f app/src/main/assets/index.html ]; then
            echo "ERROR: app/src/main/assets/index.html missing from repo - full Movie Recap Tool was not uploaded" >&2
            exit 1
          fi
          ls -lh app/src/main/assets/index.html

      - name: Build APK & AAB
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload Keystore (keep this file safe - same key needed for Play Store updates)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: app/release-key.jks
